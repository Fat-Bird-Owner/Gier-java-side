block.gier-java-tension.name = 张力
block.gier-java-tension.description = 标准的基尔炮塔，需要电力，可用石墨强化\n[green]- 击退效果
// 防御

block.gier-java-copper-fort.name = 铜穹
block.gier-java-copper-fort.description = 生成一个小型力场护盾。冷却时间长。\n- 通常不会被锁定为攻击目标\n[red]- 会爆炸

// 输送

block.gier-java-rail.name = 基础轨道
block.gier-java-rail.description = 批量运输物品。只有当铁路没有输入物品时才能输入。

block.gier-java-rail-overflow.name = 基础分流器
block.gier-java-rail-overflow.description = 可点击切换行为。[green]\n- 集路由器、溢流门与反向溢流门于一体[red]\n- 会爆炸

block.gier-java-overhead-belt.name = 架空轨道
block.gier-java-overhead-belt.description = 行为类似物品桥梁。[green]\n- 全方向[red]\n- 相当容易爆炸

block.gier-java-drone-facility.name = 无人机平台
block.gier-java-drone-facility.description = 制造运输无人机，将物品运送到对应的卸载平台。\n[red]- 需要电力\n- 会爆炸

block.gier-java-facility-dropzone.name = 无人机卸载平台
block.gier-java-facility-dropzone.description = 根据其物品配置，接收运输无人机送来的物品。\n[red]- 会爆炸

// 生产

block.gier-java-hydro-drill.name = 基础钻头
block.gier-java-hydro-drill.description = 标准钻头。需要电力才能运作。[red]\n- 需要电力\n- 会爆炸

// 制造

block.gier-java-sunder-furnace.name = 森德炉
block.gier-java-sunder-furnace.description = 一座大型笨重的冶炼熔炉。一次可同时冶炼出硅与玻璃碎片。\n[green]- 生产硅与玻璃\n[red]- 消耗大量电力[red]\n- 会爆炸

block.gier-java-industrial-trimmer.name = 碎片切割机
block.gier-java-industrial-trimmer.description = 加工玻璃碎片/废料。\n- 极其容易爆炸


// 修复

