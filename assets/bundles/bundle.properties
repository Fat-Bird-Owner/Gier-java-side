
// Items

item.gier-java-metaglass-chunk.name = Metaglass Chunk
item.gier-java-metaglass-chunk.description = An uneven piece of metaglass produced from the sunder furnace.\n\nCan be trimmed into metaglass inside the industrial trimmer.

// Turret

block.gier-java-tension.name = Tension
block.gier-java-tension.description = Standard gier turret, Requires power and can be boosted using graphite\n[green]- Knockback\n[green]- Can be boosted\n[red]- Requires power

// Defense

block.gier-java-copper-fort.name = Copper Fort
block.gier-java-copper-fort.description = Fortifies the nearby area in a durable protective shield, Requires a small amount of power.\n[green]- Durable forcefield\n-Can't normally be targeted\n[red]- Explosive

// Distribution

block.gier-java-rail.name = Rail
block.gier-java-rail.description = Moves item in bulks. Can only be inputted if the rail has no input.

block.gier-java-rail-overflow.name = Rail Overflow
block.gier-java-rail-overflow.description = Can be clicked to switch behaviors.\n\nBehaviors: router, overflow gate and underflow gate.[green]\n- Behaves as a router, overflow and underflow gate in one[red]\n- Explosive

block.gier-java-overhead-belt.name = Overhead Belt
block.gier-java-overhead-belt.description = Behaves as an item bridge.[green]\n- Omni-Directional[red]\n- Quite explosive

block.gier-java-drone-facility.name = Drone Facility
block.gier-java-drone-facility.description = Fabricates a carrier drone to transport items to facility dropzones.\n[red]- Requires power\n- Explosive

block.gier-java-facility-dropzone.name = Facility Dropzone
block.gier-java-facility-dropzone.description = Receives items from carrier drones based on it's item config.\n[red]- Explosive

// Production

block.gier-java-hydro-drill.name = Hydro Drill
block.gier-java-hydro-drill.description = Standard drill. Requires power to operate.[red]\n- Requires power\n- Explosive

// Crafting

block.gier-java-sunder-furnace.name = Sunder Furnace
block.gier-java-sunder-furnace.description = A large bulky smelting furnace. Smelts both silicon and metaglass chunks that once.\n[green]- Produces silicon & Metaglass\n[red]- Uses alot of power[red]\n- Explosive

block.gier-java-industrial-trimmer.name = Industrial Trimmer
block.gier-java-industrial-trimmer.description = Trims metaglass chunk into metaglass.\n\n[green]- Produces metaglass\n[red]- Requires power\n- Very explosive


// Effect

block.gier-java-restorator.name = Restorator
block.gier-java-hydro-drill.description = Behaves like a mender but square...\n\n[green]- Can be boosted with graphite[red]\n- Requires power

block.gier-java-mend-pylon.name = Mend Pylon
block.gier-java-mend-pylon.description = Greater restorator, Requires thrice the amount of power.\n[green]- Larger heal range\n- Higher health percentage\n- Better boost benefits[red]\n- Requires more power\n- Silicon to boost

block.gier-java-core-satellite.name = Core: Satellite
block.gier-java-core-satellite.description =  An important building. Once all cores are destroyed the sector is lost. Produces a small amount of power.\n\n[green]- Produces power

block.gier-java-core-facility.name = Core: Facility
block.gier-java-core-facility.description = An important building. Once all cores are destroyed the sector is lost. Produces a small amount of power.\n\n[green]- Produces more power then the satellite core\n-Higher durability

block.gier-java-crate.name = Crate
block.gier-java-crate.description = Stores a small amount of items.\n\n[green]- Can connect to the core\n[red]- Items are more explosive

// Power

block.gier-java-photon-panel.name = Photon Panel
block.gier-java-photon-panel.description = Generates a small amount of power

block.gier-java-transit-node.name = Transit Node
block.gier-java-transit-node.description = Connects all nearby power blocks within it range to it.\n\n[green]- Can connect infinity.\n[red]- Can't be configured.

block.gier-java-power-grid.name = Transit Node
block.gier-java-power-grid.description = A transit node with a large connection range.[green]\n- Large range\n[red]- Explosive

block.gier-java-electric-capacitor.name = Electric Capacitor
block.gier-java-electric-capacitor.description = A standard power battery.[green]\n- Stores power\n[red]- Explosive

block.gier-java-ignition-generator.name = Electric Capacitor
block.gier-java-ignition-generator.description = Generates power from burning graphite.[green]\n- Generates power[red]\n- Explosive...
block.gier-java-ignition-generator.details = Thats extremely inefficient...\n and where is it even getting the air from anyways?\n\nDon't ask 

